<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Royale – 3D Battle Royale</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;color:#fff}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud,#ui{position:fixed;inset:0;pointer-events:none}
#ui>.screen{position:absolute;inset:0;display:none;pointer-events:auto}
#ui>.screen.show{display:flex}
button{font-family:inherit;cursor:pointer;border:0;color:#fff}
.btn{background:linear-gradient(180deg,#ffd84a,#ffae1a);color:#2a1a00;font-weight:900;font-size:20px;padding:11px 30px;border-radius:12px;transform:skewX(-8deg);box-shadow:0 5px 0 #a8650a,0 10px 24px rgba(0,0,0,.4);letter-spacing:1px;transition:.12s;text-transform:uppercase}
.btn:hover{transform:skewX(-8deg) translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:skewX(-8deg) translateY(3px);box-shadow:0 2px 0 #a8650a}
.btn.sec{background:linear-gradient(180deg,#6a7ff0,#3d4fd0);color:#fff;box-shadow:0 5px 0 #222a8a,0 10px 24px rgba(0,0,0,.4)}
.btn.red{background:linear-gradient(180deg,#ff6a6a,#d82e2e);color:#fff;box-shadow:0 5px 0 #7a1010,0 10px 24px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(180deg,#58e07a,#1fae48);color:#052a10;box-shadow:0 5px 0 #0d6a28,0 10px 24px rgba(0,0,0,.4)}
.btn.sm{font-size:15px;padding:9px 18px}
.btn.dis{filter:grayscale(1);opacity:.5;pointer-events:none}
.panel{background:rgba(14,18,40,.86);border:2px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1.logo{font-family:'Arial Black',Impact,sans-serif,Impact,sans-serif;font-size:64px;line-height:.92;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 5px 0 #3d4fd0,0 10px 0 #1b2160,0 18px 30px rgba(0,0,0,.6);transform:rotate(-3deg)}
h1.logo span{color:#ffd84a;text-shadow:0 5px 0 #c27a00,0 10px 0 #6a3d00,0 18px 30px rgba(0,0,0,.6)}
h2{font-family:'Arial Black',Impact,sans-serif,sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:32px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sub{color:#9fb0ff;font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:14px}
/* title */
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-14px) scale(.97,1.03)}}
@keyframes pop{0%{transform:scale(.7) rotate(-8deg)}70%{transform:scale(1.1) rotate(3deg)}100%{transform:scale(1)}}
/* generic page */
.page{align-items:center;justify-content:center;background:rgba(6,8,24,.72)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
input[type=text]{background:#0a0e24;border:2px solid #34407f;color:#fff;border-radius:10px;padding:11px 14px;font-size:18px;font-family:inherit;outline:0;user-select:text;font-weight:700}
input[type=text]:focus{border-color:#ffd84a}
select{background:#0a0e24;border:2px solid #34407f;color:#fff;border-radius:8px;padding:7px 10px;font-size:15px;font-family:inherit}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:#1c2350;padding:9px 18px;border-radius:9px;font-weight:800;color:#aab4ff;font-size:15px}
.tab.on{background:#ffd84a;color:#2a1a00}
.set{display:flex;align-items:center;justify-content:space-between;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.07);gap:20px;min-height:46px}
.set label{font-weight:700;font-size:16px}
.set .d{font-size:12px;color:#8e9be0;font-weight:400;display:block}
.set input[type=range]{width:260px;accent-color:#ffd84a}
.set .val{width:44px;text-align:right;color:#ffd84a;font-weight:800}
.tog{width:56px;height:28px;border-radius:14px;background:#2a3166;position:relative;transition:.15s}
.tog.on{background:#3ad46a}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tog.on::after{left:31px}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}
.kbr{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:8px}
.kbr .key{min-width:96px;text-align:center;background:#0a0e24;border:2px solid #34407f;border-radius:8px;padding:6px 10px;font-weight:800;color:#ffd84a;cursor:pointer;font-size:14px}
.kbr .key:hover{border-color:#ffd84a}
.kbr .key.listen{background:#ffd84a;color:#2a1a00;animation:pulse .7s infinite}
.kbr .key.conf{border-color:#ff5a5a;color:#ff8a8a}
@keyframes pulse{50%{opacity:.6}}
/* cards */
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.card{width:300px;background:linear-gradient(180deg,#1c2350,#10143a);border:3px solid #34407f;border-radius:16px;padding:16px;cursor:pointer;transition:.15s;position:relative}
.card:hover{transform:translateY(-4px);border-color:#8896ff}
.card.sel{border-color:#ffd84a;box-shadow:0 0 30px rgba(255,216,74,.4)}
.card .pic{height:170px;display:flex;justify-content:center;margin-bottom:8px}
.card .pic img{height:170px;image-rendering:pixelated}
.card h3{font-family:'Arial Black',Impact,sans-serif;font-size:24px;text-transform:uppercase}
.card .role{color:#9fb0ff;font-weight:700;margin-bottom:8px}
.stat{display:flex;align-items:center;gap:8px;font-weight:800;margin:4px 0}
.stat i{display:block;height:10px;border-radius:5px;background:#3ad46a}
.abl{font-size:13px;margin-top:8px;padding:6px 8px;background:rgba(255,255,255,.06);border-radius:8px}
.abl b{color:#ffd84a}
.sw{display:inline-block;width:34px;height:34px;border-radius:8px;border:3px solid transparent;cursor:pointer;margin:3px}
.sw.sel{border-color:#fff;transform:scale(1.12)}
.chip{display:inline-block;padding:8px 16px;border-radius:20px;background:#1c2350;font-weight:800;cursor:pointer;border:2px solid transparent;margin:3px}
.chip.sel{border-color:#ffd84a;background:#3a3470}
.code{font-family:'Arial Black',Impact,sans-serif,monospace;font-size:54px;letter-spacing:10px;color:#ffd84a;background:#0a0e24;padding:6px 26px;border-radius:14px;border:3px dashed #5a67c0;user-select:text}
.err{color:#ff8a8a;font-weight:700;min-height:22px}
.badge{display:inline-block;padding:2px 8px;background:#ffd84a;color:#2a1a00;border-radius:6px;font-size:12px;font-weight:900;margin-left:6px}
/* loading */
#loading{align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0b1020;z-index:50}
#loading .bar{width:300px;height:10px;background:#1c2350;border-radius:6px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:#ffd84a;animation:ld 1s infinite}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
/* pause / end */
#pause,#elim,#victory{align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(5,8,24,.7)}
#elim,#victory{display:none;position:fixed;inset:0;pointer-events:auto;z-index:20}
#victory{background:radial-gradient(circle,rgba(255,200,40,.28),rgba(5,8,24,.85))}
#victory.lose{background:rgba(5,8,24,.78)}
#vicTitle{font-family:'Arial Black',Impact,sans-serif;font-size:80px;color:#ffd84a;text-shadow:0 6px 0 #a8650a,0 14px 30px rgba(0,0,0,.6);animation:pop .8s;text-align:center;transform:rotate(-2deg)}
#victory.lose #vicTitle{color:#fff;font-size:56px;text-shadow:0 5px 0 #333}
#elimPlace{font-family:'Arial Black',Impact,sans-serif;font-size:120px;color:#ff6a6a;text-shadow:0 8px 0 #7a1010}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* HUD */
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 rgba(255,0,0,0);transition:box-shadow .3s}
#vig.hurt{animation:hurt .4s}
#vig.storm{box-shadow:inset 0 0 180px rgba(150,60,255,.55)}
@keyframes hurt{0%{box-shadow:inset 0 0 160px rgba(255,0,0,.8)}100%{box-shadow:inset 0 0 0 rgba(255,0,0,0)}}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at 50% 50%,transparent 28vh,#000 28.3vh);}
#scope::before,#scope::after{content:'';position:absolute;background:#000}
#scope::before{left:0;right:0;top:50%;height:2px;margin-top:-1px}#scope::after{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
#dmgdir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#dmgdir::after{content:'';position:absolute;left:-60px;top:-190px;width:120px;height:50px;background:radial-gradient(ellipse at 50% 0,rgba(255,40,40,.85),transparent 70%)}
#dmgdir.show{animation:dd 1s}
@keyframes dd{0%{opacity:1}100%{opacity:0}}
#cross{--g:8px;position:absolute;left:50%;top:50%;width:0;height:0}
#cross{transform:scale(var(--xs,1))}
#cross.ads i{opacity:0}
#cross.ads b{width:5px;height:5px;left:-2.5px;top:-2.5px}
#cross b{background:var(--xc,#fff)!important}
#cross i{position:absolute;background:var(--xc,#fff);box-shadow:0 0 2px #000,0 0 4px #000}
#cross i:nth-child(1){width:2px;height:9px;left:-1px;top:calc(var(--g)*-1 - 9px)}
#cross i:nth-child(2){width:2px;height:9px;left:-1px;top:var(--g)}
#cross i:nth-child(3){height:2px;width:9px;top:-1px;left:calc(var(--g)*-1 - 9px)}
#cross i:nth-child(4){height:2px;width:9px;top:-1px;left:var(--g)}
#cross b{position:absolute;width:3px;height:3px;left:-1.5px;top:-1.5px;background:#fff;border-radius:50%;box-shadow:0 0 2px #000}
#hitm{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hitm i{position:absolute;width:12px;height:3px;background:#fff;box-shadow:0 0 3px #000}
#hitm i:nth-child(1){left:6px;top:6px;transform:rotate(45deg)}#hitm i:nth-child(2){left:-18px;top:6px;transform:rotate(-45deg)}#hitm i:nth-child(3){left:6px;top:-9px;transform:rotate(-45deg)}#hitm i:nth-child(4){left:-18px;top:-9px;transform:rotate(45deg)}
#hitm.sh i{background:#6ac8ff}#hitm.head i{background:#ffd23d}#hitm.kill i{background:#ff2a2a;width:16px;height:4px}
#hitm.show{animation:hm .25s}
@keyframes hm{0%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(1)}}
#topr{position:absolute;right:20px;top:16px;display:flex;gap:8px;align-items:center;flex-direction:row-reverse;margin-right:0}
.pill{background:rgba(10,14,36,.75);border:2px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 14px;font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center}
#mmwrap{position:absolute;right:20px;top:70px;width:200px}
#mm{width:200px;height:200px;border-radius:50%;box-shadow:0 0 0 4px rgba(10,14,36,.85),0 10px 24px rgba(0,0,0,.5);background:#1d4d70}
#stormbox{margin-top:10px;background:rgba(10,14,36,.75);border-left:5px solid #b06bff;border-radius:8px;padding:6px 12px;text-align:center}
#stormlbl{font-size:12px;color:#d2a8ff;font-weight:800;text-transform:uppercase;letter-spacing:1px}
#stormtime{font-size:26px;font-weight:900}
#locname{text-align:center;margin-top:6px;font-weight:900;text-shadow:0 2px 4px #000;color:#ffd84a;font-size:15px;text-transform:uppercase;letter-spacing:1px}
#killfeed{position:absolute;right:20px;top:360px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kf{background:rgba(10,14,36,.72);padding:5px 12px;border-radius:6px;font-size:14px;animation:slide .25s}
.kf i{color:#ffd84a;font-style:normal;margin:0 6px;font-size:12px;text-transform:uppercase}
.kf.mine{background:rgba(255,200,40,.35);border:1px solid #ffd84a}.kf.died{background:rgba(255,60,60,.35)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
#toasts{position:absolute;left:50%;top:62%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.toast{font-weight:900;font-size:18px;text-shadow:0 2px 6px #000;animation:tp 2.2s forwards}
@keyframes tp{0%{opacity:0;transform:translateY(12px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#announce{position:absolute;left:0;right:0;top:14%;text-align:center;font-family:'Arial Black',Impact,sans-serif;font-size:26px;text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 20px rgba(0,0,0,.6);opacity:0;text-transform:uppercase}
#announce.show{animation:an 3.2s}
@keyframes an{0%{opacity:0;transform:scale(.7)}8%{opacity:1;transform:scale(1.08)}14%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(10,14,36,.8);padding:8px 16px;border-radius:10px;font-weight:800;font-size:18px}
#prompt .k{background:#ffd84a;color:#2a1a00;border-radius:6px;padding:2px 10px;font-weight:900}
#usebar{position:absolute;left:50%;top:70%;transform:translateX(-50%);width:260px;display:none;text-align:center;font-weight:800}
#usebar div{height:12px;background:rgba(0,0,0,.6);border-radius:6px;overflow:hidden;border:2px solid #fff;margin-bottom:4px}
#usebar i{display:block;height:100%;background:#3ad46a}
#busHint{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:20px;font-weight:800;text-shadow:0 2px 6px #000;display:none}
#busHint b{background:#ffd84a;color:#2a1a00;padding:2px 10px;border-radius:6px}
#bottom{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#slots{display:flex;gap:6px}
.slot{position:relative;width:82px;height:58px;background:rgba(10,14,36,.7);border:3px solid rgba(255,255,255,.2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.slot.cur{transform:translateY(-8px) scale(1.08);box-shadow:0 0 18px rgba(255,255,255,.5);border-width:4px}
.slot em{position:absolute;left:5px;top:2px;font-style:normal;color:#ccd;font-size:12px}
.slot .wi{font-size:22px;line-height:24px}.slot .wn{text-align:center;line-height:12px;padding:0 3px}
.slot b{position:absolute;right:5px;bottom:2px;font-size:15px}
#barwrap{width:400px}
#hpbar,#shbar{position:relative;height:24px;background:rgba(0,0,0,.6);border-radius:5px;overflow:hidden;border:2px solid rgba(255,255,255,.3);margin-top:3px;transform:skewX(-10deg)}
#shbar{height:16px}
#hpbar i{display:block;height:100%;background:linear-gradient(180deg,#7bff7b,#20b83a);transition:width .15s}
#shbar i{display:block;height:100%;background:linear-gradient(180deg,#7fd0ff,#2a78ff);transition:width .15s}
#shbar.temp i{background:linear-gradient(180deg,#ffe97a,#ffb21a)}
#hpbar b,#shbar b{position:absolute;inset:0;text-align:center;font-size:13px;line-height:20px;text-shadow:0 1px 2px #000}#shbar b{line-height:12px;font-size:11px}
#abil{position:absolute;left:24px;bottom:4px;display:flex;gap:10px}
.abil{position:relative;width:62px;height:62px;border-radius:14px;background:rgba(10,14,36,.8);border:3px solid #555;overflow:hidden;text-align:center}
.abil.ready{border-color:#ffd84a}.abil.active{border-color:#4aff8a;box-shadow:0 0 18px #4aff8a}
.abil .ico{font-size:28px;line-height:50px;color:#fff;opacity:.9}.abil .an{position:absolute;bottom:2px;left:0;right:0;font-size:10px;font-weight:800;color:#ccd;line-height:11px}
.abil .cdo{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65)}.abil .cdt{position:absolute;inset:0;font-size:28px;font-weight:900;line-height:60px;text-shadow:0 2px 4px #000}
.abil .kk{position:absolute;top:2px;right:4px;font-size:12px;font-weight:900;background:#ffd84a;color:#2a1a00;padding:0 5px;border-radius:5px}
#ammoBox{position:absolute;right:24px;bottom:18px;align-items:baseline;gap:8px;display:flex;font-weight:900;text-shadow:0 2px 6px #000;flex-wrap:wrap;justify-content:flex-end;width:200px}
#ammoBox b{font-size:62px;line-height:60px}#ammoBox span{font-size:26px;color:#cdd}#ammoBox em{width:100%;text-align:right;font-style:normal;font-size:13px;letter-spacing:2px;text-transform:uppercase}
#board{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:340px;background:rgba(10,14,36,.88);border-radius:12px;padding:12px 18px;display:none}
#board div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}#board .dead{opacity:.4;text-decoration:line-through}
#dmgnums{position:absolute;inset:0;overflow:hidden}
.dn{position:absolute;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 4px #000,0 0 8px #000;transform:translate(-50%,-50%)}.dn.hd{color:#ffd23d;font-size:30px}
#bigmap{align-items:center;justify-content:center;background:rgba(5,8,24,.78);display:none;position:fixed;inset:0;z-index:15;pointer-events:none}
#bigmap canvas{width:min(88vh,88vw);height:min(88vh,88vw);border:4px solid #fff;border-radius:12px}
#toastG{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#222a60;padding:10px 20px;border-radius:10px;font-weight:800;z-index:60;display:none}
.tip{font-size:13px;color:#9fb0ff;margin-top:8px}
@media(max-width:900px){h1.logo{font-size:44px}#stage{display:none}}

/* update log */
.update-list{display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.update-entry{background:rgba(40,52,112,.42);border:1px solid rgba(150,170,255,.2);border-left:4px solid #ffd84a;border-radius:12px;padding:14px 16px}
.update-entry h3{font-family:'Arial Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;color:#ffd84a;font-size:18px;margin-bottom:7px}
.update-entry ul{padding-left:20px;color:#e5e9ff;line-height:1.65}
.update-entry .date{color:#9fb0ff;font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:5px}

/* ===================== Lobby UI v2 (Fortnite-style menus) ===================== */
:root{--cy:#2ad4ff;--yl:#ffe135;--navy:#0a1236;--line:rgba(120,170,255,.28);--disp:'Arial Black',Impact,'Helvetica Neue',sans-serif}
.btn{border-radius:3px;font-style:italic}
.btn.sec{background:linear-gradient(180deg,#43dcff,#1b94e6);color:#021a33;box-shadow:0 5px 0 #0a5a96,0 10px 24px rgba(0,0,0,.4)}
.btn.play{font-size:36px;padding:14px 84px;letter-spacing:4px;background:linear-gradient(180deg,#fff58a,#ffd617);color:#1a1200;box-shadow:0 7px 0 #b07a00,0 0 44px rgba(255,225,53,.38),0 14px 28px rgba(0,0,0,.45);position:relative;overflow:hidden}
.btn.play.sm{font-size:22px;padding:11px 40px;letter-spacing:2px}
.btn.play::after{content:'';position:absolute;top:0;bottom:0;width:60px;left:-120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 3.2s infinite}
@keyframes shine{0%,60%{left:-120px}100%{left:130%}}
.backbtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#cfe0ff;font:italic 900 14px var(--disp);letter-spacing:1.5px;text-transform:uppercase;padding:9px 18px;transform:skewX(-8deg);transition:.12s}
.backbtn:hover{background:var(--cy);color:#021a33}
/* nav */
#nav{position:absolute;left:0;right:0;top:0;height:66px;display:none;align-items:center;gap:30px;padding:0 26px;z-index:5;pointer-events:auto;background:linear-gradient(180deg,rgba(3,6,26,.95),rgba(3,6,26,.6) 75%,transparent)}
#nav.show{display:flex}
.nav-logo{font:italic 900 22px var(--disp);letter-spacing:1px;transform:skewX(-8deg);white-space:nowrap;text-shadow:0 3px 0 #1b2160}
.nav-logo span{color:var(--yl);margin-left:6px;text-shadow:0 3px 0 #8a5a00}
.nav-tabs{display:flex;gap:2px;flex:1;height:100%}
.nav-tabs button{background:none;font:italic 900 16px var(--disp);letter-spacing:1.5px;text-transform:uppercase;color:#8398e0;padding:0 20px;height:100%;position:relative;transition:color .15s}
.nav-tabs button:hover,.nav-tabs button.on{color:#fff}
.nav-tabs button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:8px;height:4px;background:var(--cy);box-shadow:0 0 14px var(--cy);transform:skewX(-24deg)}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-me{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:4px 18px 4px 4px;border-radius:30px;font-weight:900}
.nav-me img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#27358f;image-rendering:pixelated}
.nav-ico{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:900;font-size:16px;transition:.12s}
.nav-ico:hover{background:var(--cy);color:#021a33}
/* lobby home */
#title{display:block;background:radial-gradient(ellipse at 50% 85%,rgba(60,90,255,.4),transparent 60%),linear-gradient(180deg,rgba(18,10,70,.55),rgba(8,14,58,.78));backdrop-filter:blur(2px) saturate(1.2)}
.lb-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lb-bg::before{content:'';position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 90px,rgba(120,170,255,.06) 90px 170px);animation:rays 14s linear infinite}
.lb-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(2,4,20,.7))}
@keyframes rays{to{transform:translateX(260px)}}
.lb-party{position:absolute;left:28px;top:90px;width:270px;display:flex;flex-direction:column;gap:8px}
.lb-h{font:italic 900 15px var(--disp);letter-spacing:2px;text-transform:uppercase;color:#9fb6ff;margin-bottom:2px}.lb-h b{color:#fff;margin-left:6px}
.pm{display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(10,16,56,.78);border:1px solid var(--line);color:#fff;text-align:left;transform:skewX(-6deg);transition:.12s}
.pm>*{transform:skewX(6deg)}
.pm.me{border-left:4px solid var(--cy);background:linear-gradient(90deg,rgba(42,212,255,.22),rgba(10,16,56,.78))}
.pm img{width:48px;height:48px;object-fit:cover;object-position:50% 10%;background:#27358f;image-rendering:pixelated}
.pm .pn{font:italic 900 16px var(--disp);text-transform:uppercase}.pm .ps{font-size:12px;color:#9fb6ff;font-weight:700}
.pm.empty{height:64px;border-style:dashed;color:#7f92d8;font-weight:800}.pm.empty i{font-style:normal;width:48px;height:48px;line-height:44px;text-align:center;font-size:30px;border:2px dashed #4a5cb0;border-radius:50%}
.pm.empty:hover{color:#fff;border-color:var(--cy);background:rgba(42,212,255,.12)}
.lb-stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-47%);display:flex;flex-direction:column;align-items:center}
#stage{position:relative;width:min(62vh,40vw);height:min(62vh,40vw)}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 22px 18px rgba(0,0,0,.55));animation:bob 2.2s ease-in-out infinite}
#stage .pad{position:absolute;left:8%;right:8%;bottom:1%;height:13%;border-radius:50%;background:radial-gradient(ellipse,rgba(42,212,255,.6),rgba(42,212,255,.08) 60%,transparent 70%);border:2px solid rgba(42,212,255,.7);box-shadow:0 0 40px rgba(42,212,255,.5)}
#stage .sh{position:absolute;left:25%;right:25%;bottom:4%;height:5%;background:rgba(0,0,0,.4);border-radius:50%;filter:blur(6px)}
#stage.swap img{animation:pop .4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.plate{margin-top:6px;text-align:center;background:linear-gradient(90deg,transparent,rgba(5,10,40,.85),transparent);padding:6px 70px}
#stageName{font:italic 900 clamp(24px,3.4vh,36px) var(--disp);text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.lb-news{position:absolute;left:28px;bottom:58px;width:270px;text-align:left;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#6a2cff,#2a49d8);border-left:5px solid var(--yl);transition:.15s;display:flex;flex-direction:column;gap:3px}
.lb-news:hover{transform:translateY(-3px);filter:brightness(1.1)}
.lb-news .tag{align-self:flex-start;background:var(--yl);color:#1a1200;font:italic 900 11px var(--disp);padding:2px 8px;letter-spacing:1px}
.lb-news b{font:italic 900 17px var(--disp);text-transform:uppercase}.lb-news small{color:#d6dcff;font-size:12px;font-weight:700}
.lb-play{position:absolute;right:34px;bottom:46px;display:flex;flex-direction:column;align-items:stretch;gap:14px;width:360px}
.mode{text-align:left;color:#fff;padding:14px 18px;background:linear-gradient(135deg,rgba(26,36,110,.92),rgba(12,16,60,.92));border:1px solid var(--line);border-top:3px solid var(--cy);transition:.15s;position:relative}
.mode:hover{border-color:var(--cy);transform:translateY(-2px)}
.mode .mk{font:italic 900 11px var(--disp);letter-spacing:2px;text-transform:uppercase;color:var(--cy)}
.mode .mt{font:italic 900 26px var(--disp);text-transform:uppercase;margin:2px 0}
.mode .ms{font-size:13px;color:#aab8ff;font-weight:700}
.mode .mc{position:absolute;right:16px;top:16px;font:italic 900 13px var(--disp);color:#8398e0;text-transform:uppercase;letter-spacing:1px}
.hint{position:absolute;bottom:14px;left:28px;color:#8398e0;font-size:12px;font-weight:700;letter-spacing:.5px}
.ver{position:absolute;bottom:14px;right:34px;color:#8398e0;font-size:12px;font-weight:700}
/* pages */
.page{display:flex;align-items:flex-start;justify-content:center;padding:86px 4vw 36px;overflow:auto;background:radial-gradient(ellipse at 80% 0,rgba(90,60,255,.35),transparent 55%),linear-gradient(180deg,rgba(8,12,48,.9),rgba(10,10,52,.94));backdrop-filter:blur(8px) saturate(1.1)}
.pg{width:100%;max-width:1180px;margin:0 auto}
.pg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.pg-head h2{font:italic 900 clamp(30px,5vh,46px) var(--disp);text-transform:uppercase;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.4);position:relative;padding-left:20px}
.pg-head h2::before{content:'';position:absolute;left:0;top:6%;bottom:6%;width:8px;background:var(--cy);box-shadow:0 0 14px var(--cy);transform:skewX(-14deg)}
.pg-card{background:linear-gradient(135deg,rgba(28,40,112,.82),rgba(12,16,58,.92));border:1px solid var(--line);border-left:4px solid var(--cy);padding:22px;display:flex;flex-direction:column;gap:10px}
.pg-card .k,.k{font:italic 900 12px var(--disp);letter-spacing:2px;text-transform:uppercase;color:var(--cy)}
.pg-card h3{font:italic 900 28px var(--disp);text-transform:uppercase}
.pg-card p{color:#b4c2ff;line-height:1.5;font-weight:600}
.pg input[type=text]{background:rgba(3,6,30,.8);border:2px solid #34407f;border-radius:2px}
.pg input[type=text]:focus{border-color:var(--cy)}
.chip{border-radius:2px;background:rgba(255,255,255,.07);border:2px solid transparent;font:italic 900 14px var(--disp);text-transform:uppercase;transform:skewX(-8deg)}
.chip.sel{border-color:var(--cy);background:rgba(42,212,255,.22);color:#fff}
.badge{border-radius:2px;background:var(--yl);font-family:var(--disp);font-style:italic;letter-spacing:1px}
.err{color:#ff8a8a;font-weight:700;min-height:22px}
/* game mode */
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:18px;align-items:stretch}
.mode-big{position:relative;display:flex;flex-direction:column;text-align:left;color:#fff;background:linear-gradient(160deg,rgba(60,50,200,.7),rgba(12,16,58,.95));border:2px solid var(--line);overflow:hidden;transition:.15s;padding:0}
.mode-big.link:hover{border-color:var(--cy);transform:translateY(-3px)}
.mode-big.sel{border-color:#fff;box-shadow:0 0 0 2px var(--cy),0 0 30px rgba(42,212,255,.5)}
.mode-big .art{height:190px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 80%,rgba(42,212,255,.45),transparent 65%)}
.mode-big .art img{height:92%;image-rendering:pixelated;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}.mode-big .art.online{font-size:84px}
.mode-big .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mode-big h3{font:italic 900 26px var(--disp);text-transform:uppercase}.mode-big p{color:#b4c2ff;font-weight:600;line-height:1.45}
.badge.b2{background:var(--cy)}
.tick{position:absolute;top:10px;right:10px;width:26px;height:26px;background:#fff;color:#0a1236;font-weight:900;display:none;align-items:center;justify-content:center}
.sel>.tick,.tile.sel .tick{display:flex}
.pg-card.opts{gap:6px}.pg-card.opts input[type=text]{margin-top:4px}
/* locker */
.lk-body{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
.lk-prev{background:linear-gradient(180deg,rgba(60,50,200,.35),rgba(10,14,56,.9));border:1px solid var(--line);padding:18px;text-align:center}
#lkStage{position:relative;height:280px}
#lkStage img{position:relative;height:100%;image-rendering:pixelated;filter:drop-shadow(0 14px 12px rgba(0,0,0,.5));animation:bob 2.2s ease-in-out infinite}
#lkStage .pad{position:absolute;left:12%;right:12%;bottom:0;height:34px;border-radius:50%;background:radial-gradient(ellipse,rgba(42,212,255,.55),transparent 70%);border:2px solid rgba(42,212,255,.6)}
#lkName{font:italic 900 26px var(--disp);text-transform:uppercase;margin-top:10px}
#lkInfo{text-align:left;margin-top:12px}
.lk-cats,.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.cat{background:none;font:italic 900 16px var(--disp);letter-spacing:1px;text-transform:uppercase;color:#8398e0;padding:8px 20px 10px;border-bottom:4px solid transparent;transition:.12s}
.cat:hover{color:#fff}.cat.on{color:#fff;border-bottom-color:var(--cy);box-shadow:0 10px 18px -12px var(--cy)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tiles.small{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));max-width:420px}
.tile{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;border:3px solid transparent;background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 75%,#000),color-mix(in srgb,var(--rc) 22%,#0a1236));transition:.12s}
.tile:hover{transform:translateY(-3px) scale(1.02);border-color:rgba(255,255,255,.65)}
.tile.sel{border-color:#fff;box-shadow:0 0 0 2px var(--rc),0 0 26px var(--rc)}
.tile .tp{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:8px}
.tile .tp img{height:92%;image-rendering:pixelated;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.tile .tn{background:rgba(4,8,32,.85);padding:7px 6px;text-align:center;font:italic 900 13px var(--disp);text-transform:uppercase;letter-spacing:.5px}
.swb{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.5)}.swb.none{display:flex;align-items:center;justify-content:center;font-size:34px;background:rgba(0,0,0,.3)}
.trl{width:70%;height:14px;background:linear-gradient(90deg,transparent,var(--tc));transform:skewX(-30deg);box-shadow:0 0 16px var(--tc),0 -20px 0 -2px var(--tc),0 20px 0 -2px var(--tc)}
.emo{font-size:60px}
.stat{display:flex;align-items:center;gap:8px;font-weight:800;margin:4px 0}.stat i{display:block;height:10px;background:#3ad46a;transform:skewX(-20deg)}
.abl{font-size:13px;margin-top:8px;padding:8px 10px;background:rgba(255,255,255,.06);border-left:3px solid var(--cy);color:#d4dcff}.abl b{color:var(--yl);font-style:italic}
/* online + lobby */
.on-name{display:flex;align-items:center;gap:14px;margin-bottom:18px}.on-name input{width:260px}
.on-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:12px}.on-grid .pg-card{align-items:flex-start;min-height:210px}
.lb2{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:rgba(10,16,56,.7);border:1px solid var(--line);padding:14px 18px}
.code{font:italic 900 52px var(--disp);letter-spacing:10px;color:var(--yl);background:none;border:0;padding:0;text-shadow:0 4px 0 #8a5a00}
.plist{display:flex;gap:12px;flex-wrap:wrap}
.pslot{position:relative;width:150px;height:210px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:linear-gradient(165deg,rgba(70,90,240,.6),rgba(14,18,70,.95));border:2px solid var(--line)}
.pslot img{position:absolute;left:0;right:0;top:12px;margin:auto;height:150px;image-rendering:pixelated;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
.pslot .pn{position:relative;background:rgba(4,8,32,.88);padding:7px 6px;text-align:center;font:italic 900 14px var(--disp);text-transform:uppercase}
.pslot .badge{position:absolute;top:8px;left:8px;margin:0}
.pslot .bi{position:absolute;top:50px;left:0;right:0;text-align:center;font-size:64px;color:#6b7fd0}
.pslot.empty{background:rgba(10,16,56,.4);border-style:dashed;color:#6b7fd0}
.lb2-side{gap:6px}
/* settings */
.st-body{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.tabs{flex-direction:column;gap:2px;margin:0}
.tab{background:rgba(255,255,255,.05);text-align:left;font:italic 900 16px var(--disp);text-transform:uppercase;letter-spacing:1px;color:#8398e0;padding:13px 18px;border-left:4px solid transparent;border-radius:0}
.tab:hover{color:#fff;background:rgba(255,255,255,.09)}
.tab.on{background:linear-gradient(90deg,rgba(42,212,255,.28),rgba(42,212,255,.05));color:#fff;border-left-color:var(--cy)}
.set{background:rgba(14,22,72,.62);border:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px;padding:11px 18px}
.set:hover{border-color:rgba(42,212,255,.5)}
.set label{font:italic 900 15px var(--disp);text-transform:uppercase;letter-spacing:.5px}
.set input[type=range]{accent-color:var(--cy)}.set .val{color:var(--cy)}
.set select,select{background:#050a2c;border:2px solid #34407f;border-radius:2px}
.tog{border-radius:3px;transform:skewX(-10deg);background:#232c68}.tog::after{border-radius:2px}.tog.on{background:var(--cy)}
.kbr{background:rgba(14,22,72,.62);border:1px solid var(--line);border-radius:0}.kbr .key{border-radius:2px;color:var(--cy)}
.kbr .key.listen{background:var(--cy);color:#021a33}
.update-entry{border-radius:0;border-left-color:var(--cy)}.update-entry h3{color:var(--yl);font-style:italic}
@media(max-width:1000px){.lb-party,.lb-news{display:none}.lk-body,.lb2,.on-grid,.mode-grid,.st-body{grid-template-columns:1fr}.lb-play{right:50%;transform:translateX(50%)}.tabs{flex-direction:row;flex-wrap:wrap}.nav-logo{display:none}.nav-tabs button{padding:0 11px;font-size:14px}.nav-me span{display:none}}
